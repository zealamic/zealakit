<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dependency Monitor</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      :root {
        --outdated-bg: #5c3317;
        --outdated-fg: #ffd8a8;
        --ok-fg: #8ce99a;
        --pico-font-size: 15px;
        --pico-line-height: 1.4;
        --pico-spacing: 0.8rem;
        --pico-typography-spacing-vertical: 0.9rem;
        --pico-form-element-spacing-vertical: 0.4rem;
        --pico-form-element-spacing-horizontal: 0.85rem;
        --pico-border-radius: 10px;
      }

      body {
        padding-block: 1.25rem 2.5rem;
      }

      main.container {
        max-width: 1120px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem;
        flex-wrap: wrap;
        margin-bottom: 0.9rem;
      }

      header h1 {
        margin: 0;
        font-size: 1.35rem;
      }

      #refresh-btn {
        padding: 0.4rem 0.9rem;
        font-size: 0.85rem;
        border-radius: 10px;
      }

      .bucket {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .bucket + .bucket {
        margin-top: 2.25rem;
        padding-top: 2rem;
        border-top: 1px solid color-mix(in srgb, var(--pico-muted-border-color, #444) 85%, transparent);
      }

      .bucket > header {
        margin-bottom: 0.85rem;
      }

      .bucket > header h2 {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: 0.02em;
      }

      .bucket > header p {
        margin: 0.2rem 0 0;
        opacity: 0.7;
        font-size: 0.8rem;
      }

      .folder {
        margin: 0;
        padding: 0.75rem 0.9rem 0.85rem;
        border: 1px solid color-mix(in srgb, var(--pico-muted-border-color, #3a3f4a) 70%, transparent);
        border-radius: 12px;
        background: color-mix(in srgb, var(--pico-card-background-color, #1c2128) 88%, #fff 4%);
        box-shadow: none;
      }

      .folder + .folder {
        margin-top: 0.75rem;
      }

      .folder > header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 0.4rem;
      }

      .folder > header h3 {
        margin: 0;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        flex-wrap: wrap;
      }

      .folder > header p {
        margin: 0;
        opacity: 0.65;
        font-size: 0.75rem;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 0.12rem 0.45rem;
        border-radius: 8px;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.2;
        text-transform: lowercase;
        border: 1px solid transparent;
      }

      /* Template scopes — fixed palette */
      .tag[data-kind="scope"][data-value="client"] {
        color: #7dd3fc;
        background: color-mix(in srgb, #0ea5e9 22%, transparent);
        border-color: color-mix(in srgb, #0ea5e9 45%, transparent);
      }
      .tag[data-kind="scope"][data-value="server"] {
        color: #c4b5fd;
        background: color-mix(in srgb, #8b5cf6 22%, transparent);
        border-color: color-mix(in srgb, #8b5cf6 45%, transparent);
      }
      .tag[data-kind="scope"][data-value="hybrid"] {
        color: #6ee7b7;
        background: color-mix(in srgb, #10b981 22%, transparent);
        border-color: color-mix(in srgb, #10b981 45%, transparent);
      }
      .tag[data-kind="scope"][data-value="infrastructure"] {
        color: #fdba74;
        background: color-mix(in srgb, #f97316 22%, transparent);
        border-color: color-mix(in srgb, #f97316 45%, transparent);
      }

      /* Recipe categories — fixed palette */
      .tag[data-kind="category"][data-value="linter"] {
        color: #fca5a5;
        background: color-mix(in srgb, #ef4444 20%, transparent);
        border-color: color-mix(in srgb, #ef4444 42%, transparent);
      }
      .tag[data-kind="category"][data-value="state"] {
        color: #f9a8d4;
        background: color-mix(in srgb, #ec4899 20%, transparent);
        border-color: color-mix(in srgb, #ec4899 42%, transparent);
      }
      .tag[data-kind="category"][data-value="ui"] {
        color: #93c5fd;
        background: color-mix(in srgb, #3b82f6 22%, transparent);
        border-color: color-mix(in srgb, #3b82f6 45%, transparent);
      }
      .tag[data-kind="category"][data-value="form"] {
        color: #fde68a;
        background: color-mix(in srgb, #eab308 20%, transparent);
        border-color: color-mix(in srgb, #eab308 42%, transparent);
      }
      .tag[data-kind="category"][data-value="fetcher"] {
        color: #5eead4;
        background: color-mix(in srgb, #14b8a6 20%, transparent);
        border-color: color-mix(in srgb, #14b8a6 42%, transparent);
      }
      .tag[data-kind="category"][data-value="orm"] {
        color: #d8b4fe;
        background: color-mix(in srgb, #a855f7 20%, transparent);
        border-color: color-mix(in srgb, #a855f7 42%, transparent);
      }
      .tag[data-kind="category"][data-value="infrastructure"] {
        color: #fdba74;
        background: color-mix(in srgb, #f97316 20%, transparent);
        border-color: color-mix(in srgb, #f97316 42%, transparent);
      }
      .tag[data-kind="category"][data-value="utils"] {
        color: #a5b4fc;
        background: color-mix(in srgb, #6366f1 20%, transparent);
        border-color: color-mix(in srgb, #6366f1 42%, transparent);
      }
      .tag[data-kind="category"][data-value="testing"] {
        color: #86efac;
        background: color-mix(in srgb, #22c55e 20%, transparent);
        border-color: color-mix(in srgb, #22c55e 42%, transparent);
      }
      .tag[data-kind="category"][data-value="documentation"] {
        color: #67e8f9;
        background: color-mix(in srgb, #06b6d4 20%, transparent);
        border-color: color-mix(in srgb, #06b6d4 42%, transparent);
      }

      table {
        font-size: 0.85rem;
        margin-bottom: 0;
        table-layout: fixed;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--pico-muted-border-color, #3a3f4a) 55%, transparent);
      }

      thead th {
        padding: 0.45rem 0.5rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.75;
      }

      thead th:first-child {
        border-top-left-radius: 6px;
      }

      thead th:last-child {
        border-top-right-radius: 6px;
      }

      tbody tr:last-child td:first-child {
        border-bottom-left-radius: 6px;
      }

      tbody tr:last-child td:last-child {
        border-bottom-right-radius: 6px;
      }

      td,
      th {
        vertical-align: middle;
        padding: 0.4rem 0.5rem;
      }

      th:nth-child(1),
      td:nth-child(1) {
        width: 34%;
      }

      th:nth-child(2),
      td:nth-child(2) {
        width: 12%;
      }

      th:nth-child(3),
      td:nth-child(3),
      th:nth-child(4),
      td:nth-child(4) {
        width: 14%;
      }

      th:nth-child(5),
      td:nth-child(5) {
        width: 12%;
      }

      th:nth-child(6),
      td:nth-child(6) {
        width: 14%;
        text-align: right;
      }

      td:nth-child(1) {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      td code {
        font-size: 0.8rem;
        padding: 0.12rem 0.4rem;
        border-radius: 8px;
      }

      button.update {
        padding: 0.28rem 0.65rem;
        font-size: 0.78rem;
        line-height: 1.25;
        border-radius: 10px;
        margin: 0;
      }

      button.update[disabled] {
        opacity: 0.4;
      }

      .status-outdated {
        background: var(--outdated-bg);
        color: var(--outdated-fg);
        padding: 0.12rem 0.45rem;
        border-radius: 8px;
        font-size: 0.75rem;
      }

      .status-ok {
        color: var(--ok-fg);
        font-size: 0.8rem;
      }

      .status-error {
        color: #ffa8a8;
        font-size: 0.75rem;
      }

      #status-bar {
        margin-bottom: 0.75rem;
        min-height: 1.25rem;
        font-size: 0.85rem;
      }

      #status-bar[data-tone="error"] {
        color: #ffa8a8;
      }

      #status-bar[data-tone="ok"] {
        color: var(--ok-fg);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Dependency Monitor</h1>
        <button type="button" id="refresh-btn">Refresh</button>
      </header>

      <p id="status-bar" aria-live="polite">Loading…</p>
      <div id="groups"></div>
    </main>

    <script>
      const groupsEl = document.getElementById("groups");
      const statusBar = document.getElementById("status-bar");
      const refreshBtn = document.getElementById("refresh-btn");

      function setStatus(message, tone = "") {
        statusBar.textContent = message;
        if (tone) statusBar.dataset.tone = tone;
        else delete statusBar.dataset.tone;
      }

      function npmUrl(name) {
        return `https://www.npmjs.com/package/${name}`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderStatus(pkg) {
        if (pkg.error) {
          return `<span class="status-error" title="${escapeHtml(pkg.error)}">error</span>`;
        }
        if (pkg.needsUpdate) {
          return `<mark class="status-outdated">outdated</mark>`;
        }
        return `<span class="status-ok">up-to-date</span>`;
      }

      function typeLabel(pkg) {
        return pkg.overlay ? `${pkg.depType}/${pkg.overlay}` : pkg.depType;
      }

      function renderRow(group, pkg) {
        const canUpdate = group.allowUpdate !== false;
        const disabled = canUpdate && pkg.needsUpdate && pkg.latest ? "" : "disabled";
        const latest = pkg.latest ?? "—";
        const recipeId = pkg.recipeId || group.recipeId || "";
        const overlay = pkg.overlay || "";
        const isRoot = group.filePath === "package.json";
        return `
          <tr data-file="${escapeHtml(group.filePath)}" data-name="${escapeHtml(pkg.name)}" data-type="${pkg.depType}">
            <td>
              <a href="${npmUrl(pkg.name)}" target="_blank" rel="noopener noreferrer">${escapeHtml(pkg.name)}</a>
            </td>
            <td><code>${escapeHtml(typeLabel(pkg))}</code></td>
            <td><code class="current">${escapeHtml(pkg.current)}</code></td>
            <td><code class="latest">${escapeHtml(latest)}</code></td>
            <td class="status-cell">${renderStatus(pkg)}</td>
            <td>
              <button
                type="button"
                class="outline update"
                ${disabled}
                data-file="${escapeHtml(group.filePath)}"
                data-name="${escapeHtml(pkg.name)}"
                data-latest="${escapeHtml(pkg.latest ?? "")}"
                data-type="${pkg.depType}"
                data-recipe-id="${escapeHtml(recipeId)}"
                data-overlay="${escapeHtml(overlay)}"
                title="${isRoot ? "Updates package.json then runs pnpm up to refresh the lockfile" : "Update package.json version"}"
              >Update</button>
            </td>
          </tr>
        `;
      }

      function folderCategory(group) {
        if (group.filePath === "package.json" || group.label === "Root") return "root";
        if (group.recipeId || group.label?.startsWith("recipe/") || group.relativePath?.startsWith("src/registry/recipes")) {
          return "recipes";
        }
        if (group.relativePath?.startsWith("templates/") || group.label?.startsWith("template/")) {
          return "templates";
        }
        return "other";
      }

      function renderTag(group) {
        if (!group.tagKind) return "";
        const values = Array.isArray(group.tags) && group.tags.length > 0
          ? group.tags
          : group.tag
            ? [group.tag]
            : [];
        if (!values.length) return "";
        return values
          .map(
            (value) =>
              `<span class="tag" data-kind="${escapeHtml(group.tagKind)}" data-value="${escapeHtml(value)}" title="${group.tagKind}">${escapeHtml(value)}</span>`,
          )
          .join("");
      }

      function renderFolder(group) {
        const rows =
          group.packages.length > 0
            ? group.packages.map((pkg) => renderRow(group, pkg)).join("")
            : `<tr><td colspan="6"><em>No dependencies</em></td></tr>`;

        const outdated = group.packages.filter((p) => p.needsUpdate).length;
        const rootNote =
          group.filePath === "package.json"
            ? " · Update runs pnpm up (refreshes lockfile)"
            : "";
        const title =
          group.label === "Root"
            ? "package.json"
            : group.label.replace(/^(template|recipe)\//, "");

        return `
          <section class="folder" data-file="${escapeHtml(group.filePath)}">
            <header>
              <h3>${escapeHtml(title)}${renderTag(group)}</h3>
              <p>${escapeHtml(group.relativePath)} · ${group.packages.length} packages${outdated ? ` · ${outdated} outdated` : ""}${rootNote}</p>
            </header>
            <div class="overflow-auto">
              <table>
                <thead>
                  <tr>
                    <th>Package</th>
                    <th>Type</th>
                    <th>Current</th>
                    <th>Latest</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }

      let SCOPE_ORDER = [];
      let CATEGORY_ORDER = [];
      /*__ZEALAKIT_CONSTANTS__*/

      function applySortOrders(scopes, categories) {
        if (Array.isArray(scopes) && scopes.length > 0) SCOPE_ORDER = scopes;
        if (Array.isArray(categories) && categories.length > 0) CATEGORY_ORDER = categories;
        const baked = window.__ZEALAKIT__;
        if ((!SCOPE_ORDER.length || !CATEGORY_ORDER.length) && baked) {
          if (!SCOPE_ORDER.length && Array.isArray(baked.scopes)) SCOPE_ORDER = baked.scopes;
          if (!CATEGORY_ORDER.length && Array.isArray(baked.categories)) {
            CATEGORY_ORDER = baked.categories;
          }
        }
      }

      applySortOrders();

      function tagRank(group, order) {
        if (!order.length) return 0;
        const idx = order.indexOf(group.tag);
        return idx === -1 ? order.length : idx;
      }

      function sortBucketItems(bucketId, items) {
        return [...items].sort((a, b) => {
          if (bucketId === "templates") {
            const byScope = tagRank(a, SCOPE_ORDER) - tagRank(b, SCOPE_ORDER);
            if (byScope !== 0) return byScope;
            if (a.tag && b.tag && a.tag !== b.tag) return String(a.tag).localeCompare(String(b.tag));
          }
          if (bucketId === "recipes") {
            const byCategory = tagRank(a, CATEGORY_ORDER) - tagRank(b, CATEGORY_ORDER);
            if (byCategory !== 0) return byCategory;
            if (a.tag && b.tag && a.tag !== b.tag) return String(a.tag).localeCompare(String(b.tag));
          }
          return (a.label || "").localeCompare(b.label || "");
        });
      }

      function renderGroups(groups) {
        if (!groups.length) {
          groupsEl.innerHTML = "<p>No package.json files found.</p>";
          return;
        }

        const buckets = [
          { id: "root", title: "Root", blurb: "Workspace root package.json + lockfile" },
          { id: "templates", title: "Templates", blurb: "Starter apps under templates/" },
          { id: "recipes", title: "Recipes", blurb: "Versions from src/registry/recipes.ts" },
          { id: "other", title: "Other", blurb: "Additional package.json files" },
        ];

        const byCategory = Object.fromEntries(buckets.map((b) => [b.id, []]));
        for (const group of groups) {
          byCategory[folderCategory(group)].push(group);
        }

        groupsEl.innerHTML = buckets
          .filter((bucket) => byCategory[bucket.id].length > 0)
          .map((bucket) => {
            const items = sortBucketItems(bucket.id, byCategory[bucket.id]);
            const packageCount = items.reduce((sum, g) => sum + g.packages.length, 0);
            const outdated = items.reduce(
              (sum, g) => sum + g.packages.filter((p) => p.needsUpdate).length,
              0,
            );
            return `
              <section class="bucket" data-bucket="${bucket.id}">
                <header>
                  <h2>${escapeHtml(bucket.title)}</h2>
                  <p>${escapeHtml(bucket.blurb)} · ${items.length} folders · ${packageCount} packages${outdated ? ` · ${outdated} outdated` : ""}</p>
                </header>
                ${items.map((group) => renderFolder(group)).join("")}
              </section>
            `;
          })
          .join("");
      }

      async function loadPackages() {
        refreshBtn.setAttribute("aria-busy", "true");
        refreshBtn.disabled = true;
        setStatus("Fetching registry versions…");

        try {
          const res = await fetch("/api/packages");
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to load packages");
          applySortOrders(data.scopes, data.categories);
          renderGroups(data.groups || []);
          const outdated = (data.groups || []).reduce(
            (sum, g) => sum + g.packages.filter((p) => p.needsUpdate).length,
            0,
          );
          setStatus(
            outdated
              ? `Loaded ${(data.groups || []).length} groups · ${outdated} outdated`
              : `Loaded ${(data.groups || []).length} groups · all up to date`,
            outdated ? "" : "ok",
          );
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), "error");
        } finally {
          refreshBtn.removeAttribute("aria-busy");
          refreshBtn.disabled = false;
        }
      }

      async function updatePackage(button) {
        const filePath = button.dataset.file;
        const packageName = button.dataset.name;
        const newVersion = button.dataset.latest;
        const depType = button.dataset.type;
        const recipeId = button.dataset.recipeId || undefined;
        const overlay = button.dataset.overlay || undefined;

        if (!filePath || !packageName || !newVersion || !depType) return;

        button.setAttribute("aria-busy", "true");
        button.disabled = true;
        setStatus(
          filePath === "package.json"
            ? `Updating ${packageName} + pnpm up (lockfile)…`
            : `Updating ${packageName}…`,
        );

        try {
          const payload = { filePath, packageName, newVersion, depType };
          if (recipeId) payload.recipeId = recipeId;
          if (overlay) payload.overlay = overlay;

          const res = await fetch("/api/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Update failed");

          const row = button.closest("tr");
          if (row) {
            const prefixMatch = row.querySelector(".current")?.textContent?.match(/^([~^])/);
            const written = prefixMatch ? `${prefixMatch[1]}${newVersion}` : newVersion;
            row.querySelector(".current").textContent = written;
            row.querySelector(".latest").textContent = newVersion;
            row.querySelector(".status-cell").innerHTML =
              '<span class="status-ok">up-to-date</span>';
            button.disabled = true;
          }

          setStatus(
            data.lockfileSynced
              ? `Updated ${packageName} → ${newVersion} (lockfile synced)`
              : `Updated ${packageName} → ${newVersion}`,
            "ok",
          );
        } catch (error) {
          button.disabled = false;
          setStatus(error instanceof Error ? error.message : String(error), "error");
        } finally {
          button.removeAttribute("aria-busy");
        }
      }

      refreshBtn.addEventListener("click", () => {
        void loadPackages();
      });

      groupsEl.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const button = target.closest("button.update");
        if (!(button instanceof HTMLButtonElement) || button.disabled) return;
        void updatePackage(button);
      });

      void loadPackages();
    </script>
  </body>
</html>
